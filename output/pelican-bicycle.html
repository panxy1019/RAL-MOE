<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕的海边骑行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f3e9;color:#294e4b;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;min-height:100vh;display:grid;place-items:center;padding:30px}main{width:min(1100px,100%)}header{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:0 0 24px}h1{font-size:clamp(26px,4vw,42px);font-weight:600;letter-spacing:.06em;margin:7px 0}p{margin:0;color:#66817b;font-size:14px}.eyebrow{font-size:11px;letter-spacing:.24em;font-weight:600}.edition{font-size:12px;letter-spacing:.12em;white-space:nowrap} .scene{overflow:hidden;border-radius:22px;background:#dceee8;box-shadow:0 18px 55px #365c4710}canvas{width:100%;display:block;aspect-ratio:11/6}footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:22px;flex-wrap:wrap}.controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap}button{font:inherit;background:#294e4b;color:#fffdf5;border:0;padding:11px 23px;border-radius:30px;cursor:pointer;min-width:105px}button:hover{background:#3c6860}button:focus-visible,input:focus-visible{outline:3px solid #d98a45;outline-offset:4px}label{font-size:13px;display:flex;align-items:center;gap:10px}input{width:110px;accent-color:#3f796b}output{min-width:32px;font-variant-numeric:tabular-nums}.note{font-size:12px;color:#758980}@media(max-width:580px){body{padding:20px 12px}.edition{display:none}header{margin-bottom:18px}.scene{border-radius:14px}footer{gap:16px}.controls{gap:12px}input{width:85px}}
</style>
</head>
<body>
<main>
<header><div><div class="eyebrow">A LITTLE COASTAL ESCAPE</div><h1>鹈鹕的海边骑行</h1><p>海风刚好，慢慢向前。</p></div><span class="edition">PELICAN CYCLING CLUB / 01</span></header>
<div class="scene"><canvas id="scene" width="1100" height="600" role="img" aria-label="一只戴着绿帽子、系着红围巾的白鹈鹕，在海边踩着橙色自行车；车轮转动，云朵和海岸缓缓向后移动。">您的浏览器不支持 Canvas，请使用现代浏览器打开。</canvas></div>
<footer><div class="controls"><button id="pause" type="button" aria-pressed="false">暂停骑行</button><label for="speed">骑行速度 <input id="speed" type="range" min="0.4" max="2" step="0.1" value="1"><output id="value" for="speed">1.0×</output></label></div><span class="note">今日目的地：有风的地方。</span></footer>
</main>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene'), c = canvas.getContext('2d');
  const pause = document.getElementById('pause'), speed = document.getElementById('speed'), value = document.getElementById('value');
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
  let running = !reduced.matches, pace = 1, time = 0, last = null;
  const ink = '#345650', cream = '#fffdf0', orange = '#e99049';
  function path(d, fill, stroke, width=3) {const p = new Path2D(d);if(fill){c.fillStyle=fill;c.fill(p)}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.stroke(p)}}
  function ellipse(x,y,rx,ry,fill,stroke,width=3){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
  function line(x,y,x2,y2,color,width=3){c.beginPath();c.moveTo(x,y);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.stroke()}
  function cloud(x,y,s){c.save();c.translate(x,y);c.scale(s,s);path('M-63 14 Q-78-8-47-15 Q-50-44-16-40 Q9-65 33-33 Q65-34 64-8 Q91 11 65 20 L-48 20 Q-66 20-63 14','#f9faf0');c.restore()}
  function wheel(x,y,a){ellipse(x,y,76,76,'#f3eedc',ink,9);ellipse(x,y,66,66,'#e4ece1','#a0b2a3',2);for(let i=0;i<12;i++){const r=a+i*Math.PI/6;line(x+8*Math.cos(r),y+8*Math.sin(r),x+65*Math.cos(r),y+65*Math.sin(r),'#94aaa0',1.5)}ellipse(x,y,8,8,'#f4d495',ink,3);path(`M${x-66} ${y-43} A79 79 0 0 1 ${x+64} ${y-45}`,null,'#e8b967',5)}
  function leg(phase,front){const x=516+29*Math.cos(phase),y=434+29*Math.sin(phase);path(`M503 347 Q${front?559:473} 383 ${x} ${y-6}`,null,front?'#e4a24c':'#b78043',11);path(`M${x-13} ${y-5} Q${x} ${y-12} ${x+18} ${y-2} L${x+24} ${y+4} L${x-14} ${y+4} Z`,front?'#edb658':'#c9934e',ink,2);line(x-17,y+8,x+20,y+8,ink,5)}
  function draw(){
    const t=time, a=t*3.4;
    c.clearRect(0,0,1100,600);
    c.fillStyle='#dceee8';c.fillRect(0,0,1100,600);
    ellipse(872,104,48,48,'#f7d593');ellipse(872,104,61,61,null,'#e8e4c6',1);
    for(let i=0;i<5;i++)cloud(((i*280+100-t*10)%1400+1400)%1400-150,80+(i%3)*45,.6+(i%2)*.25);
    path('M0 295 Q90 243 174 277 Q250 221 353 277 Q438 255 510 290 Q636 236 723 285 Q850 228 961 278 Q1020 263 1100 280 L1100 370 L0 370 Z','#b9d6c8');
    c.fillStyle='#a9d7cf';c.fillRect(0,305,1100,125);
    for(let i=0;i<28;i++){const x=((i*137-t*(12+i%3*4))%1210+1210)%1210-55,y=323+(i*29)%95;line(x,y,x+25+i%4*11,y,'#d3e9de',2)}
    path('M0 403 Q230 383 480 409 Q760 432 1100 393 L1100 600 L0 600 Z','#e7d5af');
    path('M0 423 Q230 403 480 429 Q760 452 1100 413',null,'#f8eed3',6);
    c.fillStyle='#cdcdb5';c.fillRect(0,482,1100,118);c.fillStyle='#b5bba3';c.fillRect(0,482,1100,3);
    for(let i=0;i<12;i++){const x=((i*130-t*92)%1560+1560)%1560-150;line(x,543,x+55,543,'#eeead7',4)}
    for(let i=0;i<8;i++){const x=((i*176-t*92)%1408+1408)%1408-60;path(`M${x} 480 q-4-17-12-24 M${x} 480 q3-24 12-31 M${x} 480 q10-14 21-15`,null,'#809e78',3)}
    // Everything attached to the bicycle shares a gentle road bounce.
    c.save();c.translate(0,Math.sin(a*2)*1.4);
    ellipse(532,506,214,12,'#56695320');
    wheel(403,423,a*29/76);wheel(678,423,a*29/76);
    leg(a+Math.PI,false);
    // Rear rack, frame, chain, fork, and handlebar.
    path('M349 331 L430 331 M365 333 L398 391 M422 333 L450 369',null,ink,4);
    path('M403 423 L463 341 L516 434 Z M463 341 L626 341 L516 434 M626 341 L678 423',null,'#be6437',10);
    path('M403 423 L463 341 L516 434 Z M463 341 L626 341 L516 434 M626 341 L678 423',null,orange,6);
    path('M516 421 L403 414 Q386 423 402 434 L516 447',null,ink,2);
    line(463,342,455,315,ink,6);path('M434 313 Q456 308 480 314',null,ink,10);
    path('M626 341 L612 296 Q611 278 632 280 L654 280',null,ink,5);line(642,280,661,280,'#ae7752',8);
    ellipse(516,434,18,18,'#f2d195',ink,3);line(516-29*Math.cos(a),434-29*Math.sin(a),516+29*Math.cos(a),434+29*Math.sin(a),ink,5);
    // Pelican: tail, rounded body, long neck, throat pouch, and long beak.
    path('M449 296 Q410 295 386 273 L410 307 L392 308 Q422 331 452 322',cream,ink,3);
    path('M431 280 Q441 254 489 252 Q530 251 541 226 Q543 195 549 171 Q556 145 579 149 Q608 151 608 175 Q608 194 589 205 Q584 250 603 278 Q612 302 586 326 Q556 353 493 345 Q444 339 431 311 Q425 295 431 280 Z',cream,ink,3.5);
    path('M444 311 Q470 341 528 329 Q556 323 568 309 Q531 345 493 345 Q457 339 444 311','#e5e8d7');
    path('M467 271 Q505 253 541 277 Q559 290 584 285 Q559 313 524 311 Q490 313 467 289', '#e9eadb',ink,3);
    path('M482 282 Q508 299 537 293 M482 292 Q505 309 526 303',null,'#b8c7b8',2);
    path('M590 181 L708 190 Q667 234 616 222 Q594 216 589 202 Z','#efba68',ink,3);
    path('M592 178 Q651 176 721 190 Q672 200 594 196 Z','#edaa4e',ink,3);
    path('M705 191 L721 190 L715 197','#b7753f');
    ellipse(585,171,5.2,6.2,ink);ellipse(586,169,1.6,1.6,cream);
    path('M567 159 Q576 154 584 157',null,ink,2);
    // Cap and fluttering scarf.
    path('M549 149 Q544 119 572 116 Q595 115 600 148 Z','#487e68',ink,3);
    path('M541 150 Q578 139 620 149 Q604 158 550 155 Z','#60937b',ink,3);
    ellipse(571,116,4,3,ink);
    path('M547 223 Q565 232 590 221 L591 233 Q568 244 546 236 Z','#cc694d',ink,2);
    path(`M550 232 Q520 ${218+Math.sin(a)*5} 493 235 Q473 ${244+Math.sin(a+1)*7} 454 232 L465 248 L457 253 Q483 ${265+Math.sin(a)*5} 505 247 L553 238 Z`,'#cc694d',ink,2);
    // Forward wing reaches the handlebar.
    path('M533 266 Q570 275 602 282 Q620 283 641 279 Q650 281 643 287 Q594 301 553 287',cream,ink,3);
    leg(a,true);
    c.restore();
    // Tiny distant seabirds and foreground flowers.
    for(let i=0;i<3;i++){const x=755+i*65-t*3%60,y=222-i%2*21;path(`M${x-9} ${y} q5 ${-5-Math.sin(t*2+i)*2} 10 0 q6 -5 11 0`,null,'#7b9e92',2)}
    for(let i=0;i<7;i++){const x=((i*207-t*125)%1449+1449)%1449-90;line(x,605,x+2,574,'#7e9875',3);ellipse(x+2,574,5,5,'#f4eac8');ellipse(x+2,574,2,2,'#d1a851')}
  }
  function updateButton(){pause.textContent=running?'暂停骑行':'继续骑行';pause.setAttribute('aria-pressed',String(!running))}
  pause.addEventListener('click',()=>{running=!running;updateButton()});
  speed.addEventListener('input',()=>{pace=Number(speed.value);value.textContent=pace.toFixed(1)+'×'});
  function resize(){const dpr=Math.min(window.devicePixelRatio||1,2);const w=canvas.clientWidth;canvas.width=Math.round(w*dpr);canvas.height=Math.round(w*600/1100*dpr);c.setTransform(canvas.width/1100,0,0,canvas.height/600,0,0);draw()}
  new ResizeObserver(resize).observe(canvas);
  document.addEventListener('visibilitychange',()=>{last=null});
  function frame(now){if(last!==null&&running&&!document.hidden)time+=Math.min((now-last)/1000,.05)*pace;last=now;draw();requestAnimationFrame(frame)}
  updateButton();resize();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
